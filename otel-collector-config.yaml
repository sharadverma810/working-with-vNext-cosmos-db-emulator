receivers:

  otlp:

    protocols:

      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318


processors:

  batch:


exporters:

  # ------------------------------------------
  # Traces → Jaeger
  # ------------------------------------------

  otlp/jaeger:

    endpoint: jaeger:4317

    tls:
      insecure: true


  # ------------------------------------------
  # Debug Exporter
  #
  # TEMPORARY:
  # Write received telemetry to Collector logs.
  # ------------------------------------------

  debug:
    verbosity: detailed


  # ------------------------------------------
  # Metrics → Prometheus
  # ------------------------------------------

  prometheus:

    endpoint: 0.0.0.0:8889


service:

  pipelines:


    # ----------------------------------------
    # Trace Pipeline
    # ----------------------------------------

    traces:

      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlp/jaeger
        - debug


    # ----------------------------------------
    # Metrics Pipeline
    # ----------------------------------------

    metrics:

      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus
        - debug